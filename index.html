.terminal-scroll::-webkit-scrollbar-thumb { background: rgba(150, 150, 150, 0.3); border-radius: 3px; }
.tactile-btn:active:not(:disabled) { transform: scale(0.97); }
.cutout-ring {
  position: absolute;
  inset: -1px;
  border-radius: 28px;
  padding: 3px;
  background: conic-gradient(transparent 0deg, transparent 0deg);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s ease;
  z-index: 10;
}
.cutout-ring.active { opacity: 1; }

<script>
// Register Service Worker and force update check
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => reg.update())
      .catch(err => console.warn('SW reg failed:', err));
  });
}

const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const UART_RX_CHAR_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const UART_TX_CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

let bluetoothDevice = null;
let bluetoothServer = null;
let rxCharacteristic = null;
let txCharacteristic = null;
let isConnected = false;
let isConnecting = false;
let manualDisconnect = false;
let autoReconnectEnabled = false;
let reconnectTimer = null;
let writeChain = Promise.resolve();

const ringAnimations = {};
const ringTimeouts = {};
const RING_COLORS = { '1': '#10b981', '2': '#e11d48', '3': '#ff2a2a', '4': '#f59e0b' };
const RING_DURATIONS = { '1': 30000, '2': 30000, '3': 1000, '4': 5000 };

// Visibility check: syncs UI and triggers auto-reconnect cleanly when opening or switching back to the app
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    if (isConnected && (!bluetoothDevice || !bluetoothDevice.gatt || !bluetoothDevice.gatt.connected)) {
      handleConnectionLost();
    } else if (!isConnected && !isConnecting && autoReconnectEnabled && !manualDisconnect && bluetoothDevice) {
      scheduleAutoReconnect(300);
    }
  }
});

function triggerHaptic(cmd, notConnected = false) {
  try {
    if (!('vibrate' in navigator)) return;
    navigator.vibrate(notConnected || cmd === '3' ? [60, 40, 60] : 15);
  } catch (e) {}
}

function triggerErrorFlash(cmd) {
  stopCutoutRing(cmd);
  const ring = document.getElementById(`ring-${cmd}`);
  if (!ring) return;
  ring.style.background = 'conic-gradient(#ff2a2a 360deg, transparent 0deg)';
  ring.classList.add('active');
  ringTimeouts[cmd] = setTimeout(() => stopCutoutRing(cmd), 1000);
}

function startCutoutRing(cmd) {
  if (cmd === '1') stopCutoutRing('2');
  else if (cmd === '2') stopCutoutRing('1');
  else if (cmd === '3') { stopCutoutRing('1'); stopCutoutRing('2'); }
  stopCutoutRing(cmd);

  const ring = document.getElementById(`ring-${cmd}`);
  if (!ring) return;

  const color = RING_COLORS[cmd] || '#f59e0b';
  const duration = RING_DURATIONS[cmd] || 5000;
  ring.classList.add('active');
  const startTime = performance.now();

  function animate(now) {
    const elapsed = now - startTime;
    const progress = Math.min(1, elapsed / duration);
    const angle = (progress * 360).toFixed(1);
    ring.style.background = `conic-gradient(${color} ${angle}deg, transparent 0deg)`;
    if (elapsed < duration) {
      ringAnimations[cmd] = requestAnimationFrame(animate);
    } else {
      ring.style.background = `conic-gradient(${color} 360deg, transparent 0deg)`;
      ringTimeouts[cmd] = setTimeout(() => stopCutoutRing(cmd), 100);
    }
  }
  ringAnimations[cmd] = requestAnimationFrame(animate);
}

function stopCutoutRing(cmd) {
  if (ringAnimations[cmd]) {
    cancelAnimationFrame(ringAnimations[cmd]);
    delete ringAnimations[cmd];
  }
  if (ringTimeouts[cmd]) {
    clearTimeout(ringTimeouts[cmd]);
    delete ringTimeouts[cmd];
  }
  const ring = document.getElementById(`ring-${cmd}`);
  if (ring) {
    ring.classList.remove('active');
  }
}

function logMessage(msg, type = 'info') {
  const consoleLog = document.getElementById('consoleLog');
  if (!consoleLog) return;
  const time = new Date().toLocaleTimeString();
  const div = document.createElement('div');
  div.className = type === 'error'
    ? 'text-red-500 dark:text-red-400'
    : (type === 'success' ? 'text-emerald-600 dark:text-emerald-400' : 'text-gray-700 dark:text-gray-300');
  div.textContent = `[${time}] ${msg}`;
  consoleLog.appendChild(div);
  while (consoleLog.children.length > 50) {
    consoleLog.removeChild(consoleLog.firstChild);
  }
  consoleLog.scrollTop = consoleLog.scrollHeight;
}

function clearConsole() {
  const consoleLog = document.getElementById('consoleLog');
  if (!consoleLog) return;
  consoleLog.replaceChildren();
  const sysMsg = document.createElement('div');
  sysMsg.className = 'text-gray-400 dark:text-gray-500';
  sysMsg.textContent = '[System] Console cleared.';
  consoleLog.appendChild(sysMsg);
}

function cancelAutoReconnect() {
  if (reconnectTimer) {
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
  }
}

function scheduleAutoReconnect(delayMs = 3000) {
  cancelAutoReconnect();
  if (manualDisconnect || !autoReconnectEnabled || isConnected || !bluetoothDevice) {
    return;
  }
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    if (!isConnected && !isConnecting && !manualDisconnect && autoReconnectEnabled) {
      if (document.visibilityState === "hidden") return;
      connectBLE(true);
    }
  }, delayMs);
}

async function toggleConnection() {
  cancelAutoReconnect();

  if (isConnected) {
    manualDisconnect = true;
    autoReconnectEnabled = false;
    cleanupAndResetUI();
    if (bluetoothDevice && bluetoothDevice.gatt && bluetoothDevice.gatt.connected) {
      try { bluetoothDevice.gatt.disconnect(); } catch (e) {}
    }
    logMessage("Disconnected by user.");
    return;
  }

  if (isConnecting) {
    if (bluetoothDevice && bluetoothDevice.gatt) {
      try { bluetoothDevice.gatt.disconnect(); } catch (e) {}
    }
    isConnecting = false;
  }

  manualDisconnect = false;
  autoReconnectEnabled = true;
  await connectBLE(false);
}

function setConnectingUI(isAuto = false) {
  isConnecting = true;
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const connectBtn = document.getElementById('connectBtn');
  const connectBtnText = document.getElementById('connectBtnText');

  statusDot.className = "w-2 h-2 rounded-full bg-amber-500 animate-pulse";
  statusText.textContent = isAuto ? "Reconnecting..." : "Connecting...";

  connectBtn.className = "w-full py-3 px-4 rounded-[20px] font-semibold bg-industrial-accent hover:bg-industrial-accentHover disabled:opacity-60 disabled:cursor-not-allowed text-industrial-950 shadow-md shadow-cyan-500/10 transition-all flex items-center justify-center gap-2 tactile-btn text-sm";
  connectBtnText.textContent = isAuto ? "Connect to Gate" : "Connecting...";
  connectBtn.disabled = !isAuto;
}

async function connectBLE(isAutoReconnect = false) {
  if (isConnecting) return;
  if (!navigator.bluetooth) {
    logMessage("Web Bluetooth API not supported on this browser.", "error");
    alert("Please use Google Chrome on Android or a compatible Web Bluetooth browser.");
    return;
  }

  setConnectingUI(isAutoReconnect);
  let timeoutId = null;

  try {
    if (!isAutoReconnect || !bluetoothDevice) {
      logMessage("Scanning for 'Siddheshwar Niwas'...");
      bluetoothDevice = await navigator.bluetooth.requestDevice({
        filters: [{ name: 'Siddheshwar Niwas' }],
        optionalServices: [UART_SERVICE_UUID]
      });
    } else {
      logMessage("Attempting auto-reconnect...");
    }

    bluetoothDevice.removeEventListener('gattserverdisconnected', onGattDisconnected);

    const connectPromise = bluetoothDevice.gatt.connect();
    const timeoutPromise = new Promise((_, reject) => {
      timeoutId = setTimeout(() => {
        try { bluetoothDevice.gatt.disconnect(); } catch (e) {}
        reject(new Error("Connection timed out (10s)"));
      }, 10000);
    });

    if (!isAutoReconnect) logMessage("Connecting to GATT server...");
    try {
      bluetoothServer = await Promise.race([connectPromise, timeoutPromise]);
    } finally {
      if (timeoutId) clearTimeout(timeoutId);
    }

    const service = await bluetoothServer.getPrimaryService(UART_SERVICE_UUID);
    rxCharacteristic = await service.getCharacteristic(UART_RX_CHAR_UUID);
    txCharacteristic = await service.getCharacteristic(UART_TX_CHAR_UUID);

    await txCharacteristic.startNotifications();
    txCharacteristic.removeEventListener('characteristicvaluechanged', handleNotifications);
    txCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);

    bluetoothDevice.addEventListener('gattserverdisconnected', onGattDisconnected);

    const wasAuto = isAutoReconnect;
    autoReconnectEnabled = true;
    cancelAutoReconnect();
    updateConnectionState(true, bluetoothDevice.name || "Siddheshwar Niwas");
    logMessage(
      wasAuto
        ? `Auto-reconnected to ${bluetoothDevice.name || "Siddheshwar Niwas"}!`
        : `Connected to ${bluetoothDevice.name || "Siddheshwar Niwas"}!`,
      "success"
    );
  } catch (error) {
    isConnecting = false;
    updateConnectionState(false, "Disconnected");

    if (isAutoReconnect) {
      logMessage("Auto-reconnect failed (Out of range). Retrying...", "error");
      if (!manualDisconnect && autoReconnectEnabled) {
        scheduleAutoReconnect(3500);
      }
    } else {
      logMessage(`Connection failed: ${error.message}`, "error");
      if (!manualDisconnect && bluetoothDevice && autoReconnectEnabled) {
        scheduleAutoReconnect(3500);
      }
    }
  } finally {
    isConnecting = false;
    const connectBtn = document.getElementById('connectBtn');
    if (connectBtn) connectBtn.disabled = false;
  }
}

function sendCommand(cmd) {
  if (!isConnected || !rxCharacteristic || !bluetoothDevice || !bluetoothDevice.gatt || !bluetoothDevice.gatt.connected) {
    triggerHaptic(cmd, true);
    triggerErrorFlash(cmd);
    if (isConnected) {
      handleConnectionLost();
    } else {
      logMessage("Error: Not connected to gate.", "error");
    }
    return;
  }

  triggerHaptic(cmd);
  startCutoutRing(cmd);
  writeChain = writeChain.then(async () => {
    if (!isConnected || !rxCharacteristic) return;
    try {
      const value = new TextEncoder().encode(cmd);
      if (rxCharacteristic.properties.writeWithoutResponse && rxCharacteristic.writeValueWithoutResponse) {
        await rxCharacteristic.writeValueWithoutResponse(value);
      } else if (rxCharacteristic.writeValueWithResponse) {
        await rxCharacteristic.writeValueWithResponse(value);
      } else {
        await rxCharacteristic.writeValue(value);
      }
      logMessage(`Sent Command -> [${cmd}]`, "success");
    } catch (error) {
      logMessage(`Failed: ${error.message}`, "error");
      if (!bluetoothDevice || !bluetoothDevice.gatt || !bluetoothDevice.gatt.connected || String(error.message).includes("disconnected")) {
        handleConnectionLost();
      }
    }
  }).catch(() => {});
}

function handleNotifications(event) {
  try {
    const text = new TextDecoder().decode(event.target.value);
    const cleanText = text ? text.trim() : "";
    if (cleanText) {
      logMessage(`ESP32: ${cleanText}`);
      if (cleanText.toLowerCase().includes('stopped')) {
        ['1', '2'].forEach(stopCutoutRing);
      }
    }
  } catch (err) {
    logMessage("ESP32 notification received");
  }
}

function onGattDisconnected() {
  if (!isConnected || isConnecting || manualDisconnect) return;
  handleConnectionLost();
}

function handleConnectionLost() {
  if (!isConnected && !rxCharacteristic) return;

  cleanupAndResetUI();
  logMessage("Device disconnected (Out of range). Returned to Connect screen.", "error");

  if (!manualD
